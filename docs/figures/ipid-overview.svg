<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="872" viewBox="0 0 1320 872"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="1320" height="872" fill="#ffffff"/>

  <!-- title -->
  <text x="30" y="48" font-size="30" font-weight="700" fill="#111827">Interactive perf-interface discovery</text>
  <text x="30" y="78" font-size="17" fill="#6b7280">drperf is a checker, like Lean and Rocq: it does not derive an interface over all inputs;</text>
  <text x="30" y="100" font-size="17" fill="#6b7280">it checks the variables you annotate and breaks down what they leave unexplained.</text>

  <!-- ============================================ non-interactive -->
  <text x="30" y="148" font-size="20" font-weight="700" fill="#111827">Non-interactive<tspan dx="16" font-weight="400" fill="#6b7280">push-button, no human in the loop</tspan></text>
  <line x1="30" y1="160" x2="1290" y2="160" stroke="#d1d5db"/>

  <!-- A1: automated theorem proving -->
  <text x="30" y="215" font-size="17" font-weight="600" fill="#374151">Theorem proving</text>
  <rect x="200" y="180" width="150" height="58" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="275" y="215" font-size="18" text-anchor="middle" fill="#111827">Problem</text>
  <line x1="350" y1="209" x2="548" y2="209" stroke="#6b7280" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="550" y="180" width="320" height="58" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="710" y="205" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">SMT solver</text>
  <text x="710" y="226" font-size="14" text-anchor="middle" fill="#6b7280">Z3, cvc5</text>
  <line x1="870" y1="209" x2="1068" y2="209" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#g)"/>
  <rect x="1070" y="180" width="210" height="58" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="1175" y="215" font-size="18" text-anchor="middle" fill="#111827">Proof</text>
  <text x="710" y="263" font-size="15" text-anchor="middle" fill="#b42318">✗ times out or answers “unknown” on many problems</text>

  <!-- A2: symbolic execution -->
  <text x="30" y="325" font-size="17" font-weight="600" fill="#374151">Perf interfaces</text>
  <rect x="200" y="290" width="150" height="58" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="275" y="325" font-size="18" text-anchor="middle" fill="#111827">Program</text>
  <line x1="350" y1="319" x2="548" y2="319" stroke="#6b7280" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="550" y="290" width="320" height="58" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="710" y="315" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">Symbolic execution</text>
  <text x="710" y="336" font-size="14" text-anchor="middle" fill="#6b7280">explores every path</text>
  <line x1="870" y1="319" x2="1068" y2="319" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="7 6" marker-end="url(#g)"/>
  <rect x="1070" y="290" width="210" height="58" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="1175" y="315" font-size="18" text-anchor="middle" fill="#111827">Perf interface</text>
  <text x="1175" y="336" font-size="14" text-anchor="middle" fill="#6b7280">over all inputs</text>
  <text x="710" y="373" font-size="15" text-anchor="middle" fill="#b42318">✗ path explosion on many programs</text>

  <!-- ============================================ interactive -->
  <text x="30" y="425" font-size="20" font-weight="700" fill="#111827">Interactive<tspan dx="16" font-weight="400" fill="#6b7280">human/agent proposes, tool checks, repeat</tspan></text>
  <line x1="30" y1="437" x2="1290" y2="437" stroke="#d1d5db"/>

  <!-- B1: interactive theorem proving -->
  <text x="30" y="506" font-size="17" font-weight="600" fill="#374151">Theorem proving</text>
  <rect x="200" y="471" width="150" height="58" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="275" y="506" font-size="18" text-anchor="middle" fill="#111827">Problem</text>
  <line x1="350" y1="500" x2="388" y2="500" stroke="#6b7280" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="390" y="458" width="310" height="84" rx="8" fill="#fff7e6" stroke="#d97706"/>
  <text x="545" y="495" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">Human / agent</text>
  <text x="545" y="518" font-size="14" text-anchor="middle" fill="#6b4a12">writes the proof</text>
  <line x1="700" y1="500" x2="738" y2="500" stroke="#6b7280" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="740" y="458" width="290" height="84" rx="8" fill="#eaf2ff" stroke="#2563eb"/>
  <text x="885" y="495" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">Lean / Rocq</text>
  <text x="885" y="518" font-size="14" text-anchor="middle" fill="#1e3a8a">checks the proof steps</text>
  <line x1="1030" y1="500" x2="1068" y2="500" stroke="#6b7280" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="1070" y="471" width="210" height="58" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="1175" y="496" font-size="18" text-anchor="middle" fill="#111827">Proof</text>
  <text x="1175" y="517" font-size="14" text-anchor="middle" fill="#6b7280">checked</text>
  <path d="M885,542 C885,592 545,592 545,546" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#b)"/>
  <text x="715" y="606" font-size="15" font-style="italic" text-anchor="middle" fill="#2563eb">feedback: open goals</text>

  <!-- B2: interactive perf-interface discovery (this work) -->
  <rect x="20" y="626" width="1280" height="186" rx="12" fill="#f5f9ff" stroke="#c7dcff"/>
  <text x="30" y="686" font-size="17" font-weight="600" fill="#374151">Perf interfaces</text>
  <text x="30" y="707" font-size="14" font-weight="600" fill="#2563eb">this work</text>
  <rect x="200" y="661" width="150" height="58" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="275" y="696" font-size="18" text-anchor="middle" fill="#111827">Program</text>
  <line x1="350" y1="690" x2="388" y2="690" stroke="#6b7280" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="390" y="648" width="310" height="84" rx="8" fill="#fff7e6" stroke="#d97706"/>
  <text x="545" y="676" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">Human / agent</text>
  <text x="545" y="699" font-size="14" text-anchor="middle" fill="#6b4a12">annotates regions with</text>
  <text x="545" y="718" font-size="14" text-anchor="middle" fill="#6b4a12">performance-critical variables (PCVs)</text>
  <line x1="700" y1="690" x2="738" y2="690" stroke="#6b7280" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="740" y="648" width="290" height="84" rx="8" fill="#dbe8ff" stroke="#2563eb" stroke-width="2"/>
  <text x="885" y="676" font-size="18" font-weight="700" text-anchor="middle" fill="#111827">drperf</text>
  <text x="885" y="699" font-size="14" text-anchor="middle" fill="#1e3a8a">checks against instruction counts</text>
  <text x="885" y="718" font-size="14" text-anchor="middle" fill="#1e3a8a">after correlation fitting</text>
  <line x1="1030" y1="690" x2="1068" y2="690" stroke="#6b7280" stroke-width="1.8" marker-end="url(#g)"/>
  <rect x="1070" y="648" width="210" height="84" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="1175" y="676" font-size="18" text-anchor="middle" fill="#111827">Lightweight</text>
  <text x="1175" y="697" font-size="18" text-anchor="middle" fill="#111827">perf interface</text>
  <text x="1175" y="718" font-size="14" text-anchor="middle" fill="#6b7280">checked at measured states</text>
  <path d="M885,732 C885,782 545,782 545,736" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#b)"/>
  <text x="715" y="796" font-size="15" font-style="italic" text-anchor="middle" fill="#2563eb">feedback: cost breakdown of what the PCVs leave unexplained</text>

  <!-- takeaway -->
  <text x="30" y="850" font-size="16" fill="#374151">The human or agent supplies the insight (which variables the cost depends on); the checker supplies exact counts and a breakdown of what they leave unexplained.</text>
</svg>
